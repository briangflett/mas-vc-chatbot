<!--
  MAS VC Chatbot — WordPress embed (code-first / off-n8n version).

  Paste into an Elementor HTML widget on masadvise.org/vcportal. Replaces the old
  @n8n/chat widget (vcportal-chat-widget.html). It embeds the standalone Next.js
  chat app in an iframe and hands it the logged-in VC's WordPress identity via
  postMessage — the app resolves the CiviCRM contact ID server-side from the
  email when it isn't already cached.

  Set APP_URL to the deployed app origin before publishing.
-->
<div id="mas-vc-launcher"></div>

<script>
(function () {
  var APP_URL = "https://mas-vc-chatbot.vercel.app"; // <-- set to the deployed origin

  var launcher = document.getElementById("mas-vc-launcher");
  var iframe, wpUser = {};

  // 1. Fetch the logged-in WP user (nonce-authenticated). Mirrors the old widget.
  function loadIdentity() {
    var nonce = (window.wpApiSettings && window.wpApiSettings.nonce) || "";
    return fetch("/wp-json/wp/v2/users/me?context=edit", {
      credentials: "include",
      headers: nonce ? { "X-WP-Nonce": nonce } : {},
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (u) {
        if (!u) return;
        wpUser = {
          wp_user_id: u.id,
          wp_user_email: u.username, // WP username == MS-SSO / masadvise.org email
          wp_display_name: u.name,
          civicrm_contact_id: u.civicrm_contact_id || null,
        };
      })
      .catch(function () { /* anonymous — KB still works */ });
  }

  // 2. When the iframe app signals readiness, send identity.
  window.addEventListener("message", function (e) {
    if (e.origin !== APP_URL) return;
    if (e.data && e.data.type === "mas-vc-ready" && iframe) {
      iframe.contentWindow.postMessage({ type: "mas-vc-identity", payload: wpUser }, APP_URL);
    }
  });

  // 3. Floating button + iframe panel.
  function mount() {
    var btn = document.createElement("button");
    btn.textContent = "Ask MAS AI";
    btn.style.cssText =
      "position:fixed;bottom:20px;right:20px;z-index:9998;background:#2563eb;color:#fff;" +
      "border:none;border-radius:24px;padding:12px 20px;font-size:15px;font-weight:600;" +
      "cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)";

    var panel = document.createElement("div");
    panel.style.cssText =
      "position:fixed;bottom:78px;right:20px;z-index:9999;width:min(420px,calc(100vw - 40px));" +
      "height:min(640px,calc(100dvh - 120px));display:none;border-radius:14px;overflow:hidden;" +
      "box-shadow:0 8px 30px rgba(0,0,0,.25);background:#fff";

    iframe = document.createElement("iframe");
    iframe.src = APP_URL;
    iframe.style.cssText = "width:100%;height:100%;border:none";
    iframe.allow = "clipboard-write";
    panel.appendChild(iframe);

    btn.addEventListener("click", function () {
      panel.style.display = panel.style.display === "none" ? "block" : "none";
    });

    launcher.appendChild(btn);
    launcher.appendChild(panel);
  }

  loadIdentity().then(mount);
})();
</script>
