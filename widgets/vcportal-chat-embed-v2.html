<!--
  MAS VC Chatbot — WordPress embed (code-first / off-n8n version).

  Paste into the Elementor HTML widget that holds the chat widget (Block 1) on
  masadvise.org/vcportal, replacing the old @n8n/chat embed.

  Block 2 (the "Update your info" modal) is a separate paste — use
  widgets/vcportal-update-widget.html, which posts to this app's /api/profile.
  That flow is no longer on n8n; the n8n workflows were unpublished 2026-07-07.

  The Next.js app is a self-contained floating widget (its own toggle + panel).
  This embed loads it in a transparent, bottom-right iframe and resizes the
  iframe via a postMessage handshake: collapsed = just the toggle button,
  expanded = the full chat panel. WP identity is handed to the app on ready;
  the app resolves the CiviCRM contact ID server-side from the email.
-->
<script>
(function () {
  var APP_URL = "https://mas-vc-chatbot.vercel.app";

  // 1. Fetch the logged-in WP user (nonce-authenticated), same as the old widget.
  var wpUser = {};
  function loadIdentity() {
    var nonce = (window.wpApiSettings && window.wpApiSettings.nonce) || "";
    return fetch("/wp-json/wp/v2/users/me?context=edit", {
      credentials: "include",
      headers: nonce ? { "X-WP-Nonce": nonce } : {},
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (u) {
        if (!u) return;
        wpUser = {
          wp_user_id: u.id,
          wp_user_email: u.username, // WP username == MS-SSO / masadvise.org email
          wp_display_name: u.name,
          civicrm_contact_id: u.civicrm_contact_id || null,
        };
      })
      .catch(function () { /* anonymous — KB still works */ });
  }

  // 2. Bottom-right transparent iframe; starts collapsed (toggle only).
  var iframe = document.createElement("iframe");
  iframe.src = APP_URL;
  iframe.title = "MAS AI Assistant";
  iframe.allow = "clipboard-write";
  iframe.setAttribute("allowtransparency", "true");
  iframe.style.cssText =
    "position:fixed;bottom:0;right:0;width:100px;height:100px;border:none;" +
    "background:transparent;z-index:99999;transition:width .2s ease,height .2s ease;";
  document.body.appendChild(iframe);

  function setSize(open) {
    iframe.style.width = open ? "min(440px, 100vw)" : "100px";
    iframe.style.height = open ? "100dvh" : "100px";
  }

  // 3. Handshake: send identity on ready; resize on open/close.
  window.addEventListener("message", function (e) {
    if (e.origin !== APP_URL || !e.data) return;
    if (e.data.type === "mas-vc-ready") {
      iframe.contentWindow.postMessage({ type: "mas-vc-identity", payload: wpUser }, APP_URL);
    } else if (e.data.type === "mas-vc-widget") {
      setSize(!!e.data.open);
    }
  });

  loadIdentity();
})();
</script>
